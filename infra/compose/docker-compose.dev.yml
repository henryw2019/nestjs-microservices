services:
  auth-service:
    working_dir: /app
  command: sh -c "corepack enable pnpm && pnpm install --frozen-lockfile && pnpm prisma:generate && pnpm dev"
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ../apps/auth:/app
      - auth_node_modules:/app/node_modules

  chain-reader:
    working_dir: /app
  command: sh -c "corepack enable pnpm && pnpm install --frozen-lockfile && pnpm prisma:generate && pnpm dev"
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ../apps/chain-reader:/app
      - chain_reader_node_modules:/app/node_modules

  chain-service:
    working_dir: /app
  command: sh -c "corepack enable pnpm && pnpm install --frozen-lockfile && pnpm prisma:generate && pnpm dev"
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ../apps/chain-service:/app
      - chain_service_node_modules:/app/node_modules

  chain-indexer:
    working_dir: /app
  command: sh -c "corepack enable pnpm && pnpm install --frozen-lockfile && pnpm dev"
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ../apps/chain-indexer:/app
      - chain_indexer_node_modules:/app/node_modules

volumes:
  auth_node_modules:
  chain_reader_node_modules:
  chain_service_node_modules:
  chain_indexer_node_modules:
